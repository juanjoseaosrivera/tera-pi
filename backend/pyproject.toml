[project]
name = "tera-pi-backend"
version = "0.1.0"
description = "Backend de Tera-pi: sesiones, memoria, server tools y webhooks del agente de voz de ElevenLabs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "pymysql>=1.1",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert está permitido en los tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # contraseñas falsas en los tests

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
